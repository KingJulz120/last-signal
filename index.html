<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>LAST SIGNAL — Zombie Survival</title>

<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root { color-scheme:dark; --cream:#f5edd8; --muted:#9bb1a9; --orange:#f99b54; --glass:rgba(9,23,22,.84); --line:rgba(207,234,210,.17) }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none }
html,body { margin:0;width:100%;height:100%;overflow:hidden;background:#091514;color:var(--cream);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none }
button {font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#game {width:100%;height:100%;display:block;touch-action:none}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 32%,rgba(0,0,0,.42) 100%)}
#hud {position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
#hud.hidden,#controls.hidden {display:none}
.stat-panel {width:210px;max-width:36vw;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:rgba(6,19,19,.78);border-radius:14px;padding:10px 12px;box-shadow:0 12px 30px #0005;backdrop-filter:blur(8px)}
.stat-line{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:1px;font-weight:750}
.stat-line .sym{width:17px;font-size:13px;text-align:center}
.track{height:6px;flex:1;border-radius:20px;background:#3a4542;overflow:hidden}.fill{display:block;width:100%;height:100%;border-radius:20px;transition:width .2s linear}.hp{background:linear-gradient(90deg,#bb554d,#f28d75)}.hunger{background:linear-gradient(90deg,#aa813e,#e1bf73)}.thirst{background:linear-gradient(90deg,#3686a7,#63c9de)}
.stat-num{min-width:26px;text-align:right;font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted)}
.center-hud{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.day-badge{padding:7px 16px;border:1px solid #cba5786e;border-radius:99px;background:rgba(14,28,26,.83);font-size:11px;font-weight:850;letter-spacing:2px;white-space:nowrap}
#objective{max-width:330px;padding:7px 11px;border-radius:9px;color:#d7e4d4;background:rgba(9,23,22,.7);font-size:11px;line-height:1.5}
.right-hud{display:flex;align-items:flex-start;gap:7px;justify-content:flex-end;min-width:190px;max-width:36vw}
.inventory-quick{background:rgba(6,19,19,.76);border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:flex;gap:10px;align-items:center;font-size:11px;font-weight:800;color:#dae5d9;white-space:nowrap}
.small-btn{pointer-events:auto;min-width:36px;min-height:36px;background:rgba(11,31,28,.9);border:1px solid rgba(216,238,223,.24);border-radius:11px;font-size:18px}
#controls{position:absolute;inset:0;z-index:6;pointer-events:none}
#joy-zone{position:absolute;left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:38%;height:59%;max-height:295px;pointer-events:auto;touch-action:none}
#joy-base{position:absolute;left:56px;bottom:49px;width:128px;height:128px;border-radius:50%;border:2px solid rgba(219,232,214,.24);background:radial-gradient(circle,rgba(151,190,158,.14),rgba(8,26,26,.34));box-shadow:inset 0 0 30px #0004,0 0 28px #0003;pointer-events:none;transition:opacity .1s}
#joy-base:before,#joy-base:after {content:"";position:absolute;background:#b6cfc580}
#joy-base:before{height:1px;left:11px;right:11px;top:50%}#joy-base:after{width:1px;top:11px;bottom:11px;left:50%}
#joy-knob{position:absolute;left:41px;top:41px;width:44px;height:44px;border-radius:50%;border:2px solid #ebddbd99;background:linear-gradient(145deg,#b6c9ac,#627f6c);box-shadow:0 3px 15px #0008}
#joy-hint{position:absolute;bottom:19px;left:79px;font-size:9px;letter-spacing:2px;color:#dce7d0a9;font-weight:800}
#actions{position:absolute;right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 26px);display:grid;grid-template-columns:repeat(2,minmax(75px,90px));grid-template-rows:repeat(2,65px);gap:10px;pointer-events:auto}
.action{background:linear-gradient(180deg,rgba(37,58,48,.96),rgba(12,30,27,.96));border:1px solid #b5c8ae5b;border-radius:15px;box-shadow:0 6px 16px #0008,inset 0 1px #fff2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-weight:850;font-size:10px;letter-spacing:1px;touch-action:manipulation;transition:transform .08s,background .1s}
.action .action-icon{font-size:23px;line-height:1.2}
.action:active,.action.pressed{transform:scale(.92);background:#537a59}
.action.orange{background:linear-gradient(180deg,#b95a30,#763722);border-color:#f9aa6e;box-shadow:0 7px 25px #0008,inset 0 1px #ffd7b155}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 7px);left:50%;transform:translateX(-50%);min-width:180px;text-align:center;font-size:10px;color:#bacbc0aa;letter-spacing:.8px;z-index:4;pointer-events:none}
#toast{position:absolute;top:25%;left:50%;transform:translate(-50%,-10px);opacity:0;z-index:18;pointer-events:none;max-width:min(88vw,500px);padding:12px 20px;border-radius:12px;background:rgba(8,25,23,.96);border:1px solid #f99b547c;box-shadow:0 12px 45px #0009;font-size:12px;letter-spacing:.9px;text-align:center;font-weight:800;transition:opacity .2s,transform .2s}
#toast.shown{opacity:1;transform:translate(-50%,0)}
#overlay{position:absolute;inset:0;z-index:25;background:radial-gradient(ellipse at 45% 38%,rgba(30,54,43,.85),rgba(3,14,16,.98)),linear-gradient(120deg,#152620,#050d11);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);overflow:auto;touch-action:pan-y}
#overlay.hidden{display:none}
#overlay:before{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#e6e6dc 4px)}
.panel{position:relative;width:min(100%,700px);max-height:100%;overflow:auto;touch-action:pan-y;background:linear-gradient(142deg,rgba(26,47,41,.95),rgba(6,20,21,.97));border:1px solid #a2c2a54a;border-radius:22px;box-shadow:0 20px 70px #000c;padding:clamp(18px,4vh,38px);scrollbar-width:thin}
.eyebrow{color:var(--orange);letter-spacing:3px;font-size:10px;font-weight:900;text-transform:uppercase}
.logo{font-weight:1000;font-size:clamp(38px,7vw,68px);letter-spacing:-2.8px;line-height:1.04;margin:10px 0 12px;text-shadow:0 3px 22px #000b}
.logo span{color:var(--orange)}
.lede{color:#b6c9c0;line-height:1.7;font-size:13px;margin-bottom:20px;max-width:510px}
.features{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 23px}
.feature{font-size:10px;color:#c6d5ce;border:1px solid #ffffff21;border-radius:40px;padding:7px 11px;background:#ffffff0a}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.primary,.secondary{border-radius:11px;border:1px solid #f6ae78;min-height:43px;padding:10px 19px;font-size:12px;letter-spacing:1.3px;font-weight:850}
.primary{background:linear-gradient(180deg,#ed9956,#b35b35);color:#231b17}.secondary{background:rgba(21,47,39,.65);border-color:#abc2b46e;color:#eee9d9}.primary:disabled,.secondary:disabled{opacity:.35;cursor:default}
.modal-title{margin:8px 0 13px;font-size:27px;letter-spacing:1px}.subtitle{color:#c5d4ca;font-size:12px;line-height:1.5;margin:0 0 15px}
.recipes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.recipe{display:flex;align-items:flex-start;gap:9px;text-align:left;padding:12px;border-radius:12px;background:#152e28;border:1px solid #7b95834b;min-height:100px}.recipe.enabled{border-color:#ca9f66b8}.recipe:disabled{opacity:.53;cursor:default}.recipe .glyph{font-size:28px;line-height:1.3}.recipe .detail{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#becdc1}.recipe strong{font-size:12px;color:var(--cream);letter-spacing:1px}.recipe em{font-style:normal;color:#e9b77c;font-size:10px}
.supply-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:15px 0}.supply{padding:13px 8px;border-radius:10px;border:1px solid #adc3aa3d;background:rgba(255,255,255,.045);text-align:center;font-size:11px}.supply .big{font-size:22px;margin-bottom:4px}.supply .count{font-weight:900;color:#f6b982;font-size:18px}
.tiny{font-size:10px;color:#99ada4;line-height:1.6}.divider{height:1px;background:#ffffff20;margin:15px 0}
#landscape-warning{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;z-index:7;color:#f6cd99;background:#071614df;padding:6px 10px;border-radius:7px;font-size:10px;white-space:nowrap;pointer-events:none}
@media (orientation:portrait) and (max-width:650px){#landscape-warning{display:block}#hud{gap:5px;padding:calc(env(safe-area-inset-top) + 6px) 7px 0}.stat-panel{width:105px;max-width:35vw;padding:6px;gap:3px}.stat-line{font-size:8px;gap:3px}.stat-line .sym{width:12px;font-size:10px}.stat-num{min-width:17px;font-size:8px}.center-hud{gap:4px}.day-badge{font-size:9px;padding:6px 8px}#objective{font-size:9px;padding:5px 6px}.right-hud{min-width:0;max-width:25vw;gap:3px}.inventory-quick{display:none}.small-btn{min-height:31px;min-width:31px}#joy-base{left:4px;bottom:36px;width:110px;height:110px}#joy-knob{left:34px;top:34px}#joy-hint{left:30px;bottom:7px}#actions{right:calc(env(safe-area-inset-right) + 8px);bottom:calc(env(safe-area-inset-bottom) + 28px);grid-template-columns:repeat(2,66px);grid-template-rows:repeat(2,57px);gap:6px}.action{font-size:8px}.action .action-icon{font-size:20px}#hint{display:none}.recipes{grid-template-columns:1fr}.panel{padding:16px}.logo{font-size:42px}}
@media(max-height:480px){#hud{padding-top:calc(env(safe-area-inset-top) + 5px)}.stat-panel{padding:7px 10px;gap:4px}.day-badge{padding:5px 12px}#objective{padding:4px 9px}#joy-zone{bottom:4px;height:62%}#joy-base{bottom:26px;width:105px;height:105px;left:35px}#joy-knob{left:32px;top:32px}#joy-hint{bottom:2px;left:52px}#actions{bottom:calc(env(safe-area-inset-bottom) + 10px);grid-template-columns:repeat(2,75px);grid-template-rows:repeat(2,54px);gap:7px}.action .action-icon{font-size:20px}.panel{padding:17px}.logo{font-size:45px}}
</style>
</head>
<body>
<canvas id="game" aria-label="LAST SIGNAL Zombie-Survival-Spiel"></canvas>
<div id="vignette"></div>
<div id="hud" class="hidden">
  <div class="stat-panel">
    <div class="stat-line"><span class="sym">♥</span><span class="track"><span class="fill hp" id="hpBar"></span></span><span class="stat-num" id="hpText">100</span></div>
    <div class="stat-line"><span class="sym">◆</span><span class="track"><span class="fill hunger" id="foodBar"></span></span><span class="stat-num" id="foodText">95</span></div>
    <div class="stat-line"><span class="sym">≈</span><span class="track"><span class="fill thirst" id="waterBar"></span></span><span class="stat-num" id="waterText">95</span></div>
  </div>
  <div class="center-hud"><div class="day-badge" id="dayText">TAG 1 · TAG</div><div id="objective">Überlebe bis Tag 3 · Baue ein Lagerfeuer</div></div>
  <div class="right-hud"><div class="inventory-quick" id="quickStats">🪵 2 &nbsp; 🪨 0 &nbsp; ⚙ 0</div><button class="small-btn" id="muteBtn" aria-label="Ton an oder aus">♫</button><button class="small-btn" id="pauseBtn" aria-label="Pausieren">Ⅱ</button></div>
</div>
<div id="controls" class="hidden">
  <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div><div id="joy-hint">BEWEGEN</div></div>
  <div id="actions">
    <button id="attackBtn" class="action orange"><span class="action-icon">⚔</span>ANGRIFF</button>
    <button id="gatherBtn" class="action"><span class="action-icon">✋</span>SAMMELN</button>
    <button id="craftBtn" class="action"><span class="action-icon">⚒</span>CRAFTING</button>
    <button id="bagBtn" class="action"><span class="action-icon">▣</span>RUCKSACK</button>
  </div>
</div>
<div id="hint">WASD · E SAMMELN · LEERTASTE ANGRIFF · C CRAFTING</div>
<div id="landscape-warning">↻ Im Querformat spielt es sich besser</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), cvs=$('game'), g=cvs.getContext('2d',{alpha:false});
const W=2900,H=2140,DAY=110,SAVE='last_signal_html5_v1',TWO=Math.PI*2;
const LABELS={wood:'Holz',stone:'Stein',scrap:'Schrott',berry:'Beeren',water:'Wasser',cloth:'Stoff',medkit:'Verbände'};
const ICONS={wood:'🪵',stone:'🪨',scrap:'⚙️',berry:'🍓',water:'💧',cloth:'🧵',medkit:'✚'};
const RECIPES=[
 {key:'spear',name:'SPEER',icon:'⚔️',cost:{wood:4,stone:2},desc:'Erhöhter Nahkampfschaden und Reichweite'},
 {key:'medkit',name:'VERBAND',icon:'✚',cost:{cloth:2,berry:2},desc:'Heilt 45 Lebenspunkte im Rucksack'},
 {key:'fire',name:'LAGERFEUER',icon:'🔥',cost:{wood:6,stone:4},desc:'Heilt in seiner Nähe und schreckt Zombies ab'},
 {key:'wall',name:'BARRIKADE',icon:'▤',cost:{wood:4,scrap:3},desc:'Blockiert und verlangsamt Zombies'},
 {key:'radio',name:'FUNKSIGNAL',icon:'📡',cost:{wood:10,stone:8,scrap:14,cloth:3},desc:'Ab Tag 3 mit Lagerfeuer: Rettung rufen'}
];
let mode='menu',state=null,resources=[],terrain=[],shacks=[],cars=[],zombies=[],particles=[],cam={x:0,y:0},view={w:1,h:1,dpr:1,zoom:1},clock=0,prev=0,hudTime=0,spawnTime=0,attackCD=0,shake=0,toastHandle=0,muted=false,joystick={x:0,y:0,pointer:null},keys={},audio=null;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function seeded(seed){let x=seed>>>0;return()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296}}
const worldRand=seeded(919342);
function palette(){const night=state?isNight():false;return night?{ground:'#162c2e',patch:'#22403a'}:{ground:'#263e32',patch:'#36503a'}}
function isNight(){return state&&((state.elapsed%DAY)/DAY)>.65}
function day(){return state?Math.floor(state.elapsed/DAY)+1:1}
function fresh(){return {x:0,y:0,hp:100,food:95,water:95,elapsed:0,kills:0,inv:{wood:2,stone:0,scrap:0,berry:3,water:3,cloth:1,medkit:0},spear:false,harvested:[],placed:[],face:Math.PI/2,won:false}}
function buildWorld(){
 resources=[];terrain=[];shacks=[];cars=[];worldRand();
 const random=seeded(184216);
 const kinds=['tree','tree','tree','stone','stone','scrap','scrap','berry','berry','water','cloth'];
 for(let i=0;i<465;i++){let x=(random()-.5)*(W-90),y=(random()-.5)*(H-90);terrain.push({x,y,r:8+random()*37,v:random()})}
 for(let i=0;i<330;i++){
  let x=(random()-.5)*(W-115),y=(random()-.5)*(H-120);
  if(Math.hypot(x,y)<135){x+=x>0?170:-170;y+=y>0?160:-160}
  const kind=kinds[Math.floor(random()*kinds.length)];
  resources.push({id:i,x,y,kind,phase:random()*6.28,taken:false});
 }
 // Fertige Ressourcen in der Startzone für einen fairen Einstieg.
 [['tree',205,85],['tree',-175,80],['stone',-140,-140],['stone',180,-135],['scrap',270,-165],['berry',70,180],['water',-65,220],['cloth',-255,-55],['scrap',-225,180],['tree',310,30],['stone',60,-270],['scrap',-55,-290]].forEach(([kind,x,y],i)=>resources.push({id:330+i,x,y,kind,phase:i,taken:false}));
 shacks=[{x:-840,y:-460,ang:.04},{x:990,y:570,ang:-.15},{x:390,y:-730,ang:.1},{x:-1090,y:510,ang:-.06}];
 cars=[{x:400,y:-265,ang:.08},{x:-490,y:-250,ang:-.05},{x:780,y:-270,ang:.22},{x:-920,y:-240,ang:-.14}];
}
function restore(){try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(!s||!s.inv||!Number.isFinite(s.x))return null;const d=fresh();Object.assign(d,s);d.inv=Object.assign(d.inv,s.inv);return d}catch(e){return null}}
function persist(){if(!state||!['playing','paused','craft','bag'].includes(mode))return;try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
function erase(){try{localStorage.removeItem(SAVE)}catch(e){}}
function start(resume){state=resume?restore():null;if(!state){state=fresh();erase()}buildWorld();const used=new Set(state.harvested);resources.forEach(r=>r.taken=used.has(r.id));zombies=[];particles=[];cam.x=state.x;cam.y=state.y;clock=0;prev=0;spawnTime=0;attackCD=0;mode='playing';$('overlay').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');updateHUD();toast('Überlebe bis Tag 3. Sammle Vorräte.');playTone('start');}
function menu(){mode='menu';const saved=restore();$('overlay').classList.remove('hidden');$('hud').classList.add('hidden');$('controls').classList.add('hidden');$('panel').innerHTML=`
 <div class="eyebrow">OFFLINE SURVIVAL · EINSATZBERICHT 001</div>
 <div class="logo">LAST <span>SIGNAL</span></div>
 <p class="lede">Die Städte sind verstummt. Die Infizierten ziehen durch die Wälder. Sammle Ressourcen, fertige Waffen, sichere dein Lager und überlebe, bis du an <b>Tag 3</b> die Rettung über Funk rufen kannst.</p>
 <div class="features"><span class="feature">☣ Zombie-KI</span><span class="feature">⚒ Crafting</span><span class="feature">☾ Tag & Nacht</span><span class="feature">▣ Speichersystem</span><span class="feature">📱 Touch</span></div>
 <div class="modal-actions"><button class="primary" data-do="new">NEUES SPIEL STARTEN</button>${saved?'<button class="secondary" data-do="continue">SPIELSTAND FORTSETZEN</button>':''}</div>
 <div class="divider"></div><p class="tiny">Bewegen: linker virtueller Stick · SAMMELN neben Ressourcen · ANGRIFF in Zombie-Reichweite · CRAFTING für Werkzeuge und Lager · RUCKSACK für Essen, Trinken und Verbände. Fortschritt wird lokal im Browser gespeichert.</p>`;
}
function pause(){if(mode!=='playing')return;mode='paused';persist();joystick.x=joystick.y=0;showPanel('pause')}
function resume(){mode='playing';$('overlay').classList.add('hidden');prev=0}
function showPanel(type){if(!state)return;mode=type;joystick.x=joystick.y=0;const html={
 pause:`<div class="eyebrow">EINSATZ UNTERBROCHEN</div><h2 class="modal-title">PAUSE</h2><p class="subtitle">Tag ${day()} · ${state.kills} Zombies besiegt · Speichern automatisch aktiviert.</p><div class="modal-actions"><button class="primary" data-do="resume">WEITERSPIELEN</button><button class="secondary" data-do="save">SPEICHERN</button><button class="secondary" data-do="menu">HAUPTMENÜ</button></div>`,
 craft:`<div class="eyebrow">ÜBERLEBEN · WERKBANK</div><h2 class="modal-title">CRAFTING</h2><p class="subtitle">Fertige Waffen und Bauwerke aus gesammelten Materialien. Zum Bauen benötigst du die angegebenen Rohstoffe.</p><div class="recipes">${RECIPES.map(r=>{const ready=afford(r.cost)&&(r.key!=='radio'||(day()>=3&&state.placed.some(p=>p.kind==='fire')))&&(r.key!=='spear'||!state.spear);const cost=Object.entries(r.cost).map(([k,v])=>`${ICONS[k]} ${v}`).join(' · ');return `<button class="recipe ${ready?'enabled':''}" data-craft="${r.key}" ${ready?'':'disabled'}><span class="glyph">${r.icon}</span><span class="detail"><strong>${r.name}</strong><span>${r.desc}</span><em>${cost}</em></span></button>`}).join('')}</div><div class="modal-actions"><button class="secondary" data-do="resume">ZURÜCK ZUM SPIEL</button></div><div class="tiny" style="margin-top:10px">Funksignal: ab Tag 3 und nur mit mindestens einem Lagerfeuer.</div>`,

function render(t){g.setTransform(view.dpr,0,0,view.dpr,0,0);g.fillStyle='#091514';g.fillRect(0,0,view.w,view.h);if(!state)return;
 cam.x+=(state.x-cam.x)*.085;cam.y+=(state.y-cam.y)*.085;let sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;shake*=.84;if(shake<.2)shake=0;
 g.save();g.translate(view.w/2+sx,view.h/2+sy);g.scale(view.zoom,view.zoom);g.translate(-cam.x,-cam.y);drawGround(t);
 for(const s of shacks)if(visible(s.x,s.y,220))drawCabin(s);for(const c of cars)if(visible(c.x,c.y,130))drawCar(c);
 const objects=[];for(const r of resources)if(!r.taken&&visible(r.x,r.y,85))objects.push({y:r.y,draw:()=>drawResource(r,t)});for(let p of state.placed)if(visible(p.x,p.y,90))objects.push({y:p.y,draw:()=>drawPlaced(p,t)});for(let z of zombies)if(visible(z.x,z.y,80))objects.push({y:z.y,draw:()=>drawZombie(z,t)});objects.push({y:state.y,draw:()=>drawPlayer(t)});objects.sort((a,b)=>a.y-b.y);for(let o of objects)o.draw();
 for(let p of particles){g.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x,p.y,p.r,p.color)}g.globalAlpha=1;g.restore();drawNight(t);
 // Weltgrenze und Entfernungshinweise sind bewusst ohne HUD-Unordnung.
}
function frame(ts){let dt=prev?Math.min((ts-prev)/1000,.05):0;prev=ts;const t=ts/1000;if(mode==='playing')update(dt);render(t);requestAnimationFrame(frame)}
function setupJoystick(){const zone=$('joy-zone'),base=$('joy-base'),knob=$('joy-knob');let origin={x:0,y:0};const update=e=>{const dx=e.clientX-origin.x,dy=e.clientY-origin.y;const d=Math.hypot(dx,dy),max=48;let nx=d?dx/Math.max(d,max):0,ny=d?dy/Math.max(d,max):0;joystick.x=nx;joystick.y=ny;knob.style.transform=`translate(${clamp(dx,-max,max)}px,${clamp(dy,-max,max)}px)`};zone.addEventListener('pointerdown',e=>{if(mode!=='playing'||joystick.pointer!==null)return;e.preventDefault();joystick.pointer=e.pointerId;zone.setPointerCapture(e.pointerId);const rect=base.getBoundingClientRect();origin.x=rect.left+rect.width/2;origin.y=rect.top+rect.height/2;update(e)});zone.addEventListener('pointermove',e=>{if(e.pointerId!==joystick.pointer)return;e.preventDefault();update(e)});const release=e=>{if(e.pointerId!==joystick.pointer)return;joystick.pointer=null;joystick.x=joystick.y=0;knob.style.transform='translate(0px,0px)'};zone.addEventListener('pointerup',release);zone.addEventListener('pointercancel',release);window.addEventListener('blur',()=>{joystick.pointer=null;joystick.x=joystick.y=0;knob.style.transform='translate(0px,0px)';persist();if(mode==='playing')pause()})}
setupJoystick();
$('attackBtn').addEventListener('pointerdown',e=>{e.preventDefault();attack()});$('gatherBtn').addEventListener('pointerdown',e=>{e.preventDefault();gather()});$('craftBtn').addEventListener('click',()=>{if(mode==='playing')showPanel('craft')});$('bagBtn').addEventListener('click',()=>{if(mode==='playing')showPanel('bag')});$('pauseBtn').addEventListener('click',pause);$('muteBtn').addEventListener('click',()=>{muted=!muted;$('muteBtn').textContent=muted?'♪̸':'♫';toast(muted?'Ton deaktiviert':'Ton aktiviert')});
$('panel').addEventListener('click',e=>{const target=e.target.closest('[data-do],[data-craft]');if(!target)return;const action=target.dataset.do;if(target.dataset.craft){craft(target.dataset.craft);return}if(action==='new')start(false);else if(action==='continue')start(true);else if(action==='resume')resume();else if(action==='save'){persist();toast('Spielstand gespeichert')}else if(action==='menu'){persist();menu()}else if(action==='eat')consume('berry');else if(action==='drink')consume('water');else if(action==='heal')consume('medkit')});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(mode==='playing'){if(e.code==='Space')attack();if(e.code==='KeyE')gather();if(e.code==='KeyC')showPanel('craft');if(e.code==='KeyI'||e.code==='KeyB')showPanel('bag');if(e.code==='Escape'||e.code==='KeyP')pause();if(e.code==='Digit1')consume('berry');if(e.code==='Digit2')consume('water');if(e.code==='Digit3')consume('medkit')}else if(['paused','craft','bag'].includes(mode)&&e.code==='Escape')resume()});window.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();if(mode==='playing')pause()}});window.addEventListener('pagehide',persist);
document.addEventListener('touchmove',e=>{if(!e.target.closest('.panel'))e.preventDefault()},{passive:false});
// Entwicklungs-/QA-Informationen für lokale Tests, ohne Netzwerkanfragen.
window.LAST_SIGNAL_DEBUG={getMode:()=>mode,getState:()=>state&&JSON.parse(JSON.stringify(state)),getWorld:()=>({resources:resources.length,zombies:zombies.length,structures:state?.placed.length||0}),newGame:()=>start(false),gather,attack,craft,consume,showPanel,update,save:persist,load:restore};
buildWorld();menu();requestAnimationFrame(frame);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
