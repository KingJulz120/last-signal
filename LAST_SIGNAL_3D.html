function updateUI(){if(!state)return;for(let [key,value]of [['hp',state.hp],['food',state.food],['water',state.water],['stam',state.stamina]]){$(key+'fill').style.width=clamp(value,0,100)+'%';$(key+'num').textContent=Math.round(Math.max(0,value))}let q=countBuild();let next=q.find(v=>!v.ok);$('quest').textContent=state.won?'✓ Sektor gesichert — du kannst weiterbauen':next?`MISSION ${q.filter(v=>v.ok).length+1}/6: ${next.label}`:'Überlebe in deinem sicheren Lager';let hour=(8+state.elapsed/300*24)%24;$('clock').textContent=`TAG ${Math.floor((8+state.elapsed/300*24)/24)+1} · ${String(Math.floor(hour)).padStart(2,'0')}:${String(Math.floor(hour%1*60)).padStart(2,'0')} · ☣ ${state.kills}`;let n=nearest();$('near').textContent=buildType?'BAUMODUS: '+blueprints[buildType].name+' · Drehen/Platzieren':n?n.type==='chest'?'✋ Lagerkiste öffnen':'✋ '+({tree:'Baum fällen',rock:'Stein abbauen',scrap:'Schrott bergen',bush:'Pflanzen sammeln',water:'Wasser aufnehmen',food:'Vorräte sichern',cloth:'Stoff bergen'}[n.obj.kind]):'Bewegen: links · Kamera: rechts wischen';drawMiniMap()}
function drawMiniMap(){let c=$('minimap'),c2=c.getContext('2d'),w=c.width;c2.clearRect(0,0,w,w);c2.fillStyle='#163127';c2.fillRect(0,0,w,w);c2.strokeStyle='#71816d';c2.lineWidth=4;c2.beginPath();let mx=x=>w/2+(x-state.x)*2.3,mz=z=>w/2+(z-state.z)*2.3;c2.moveTo(mx(19),mz(-80));c2.lineTo(mx(19),mz(80));c2.stroke();for(let h of houses){c2.fillStyle='#849084';c2.fillRect(mx(h.x)-h.w, mz(h.z)-h.d,h.w*2,h.d*2)}for(let n of nodes){if(state.taken.includes(n.id))continue;if(Math.abs(n.x-state.x)>42||Math.abs(n.z-state.z)>42)continue;c2.fillStyle=n.kind==='tree'?'#3c6844':n.kind==='water'?'#7dc7e2':'#a7a78d';c2.fillRect(mx(n.x),mz(n.z),3,3)}for(let b of state.built){c2.fillStyle='#f8c48f';c2.fillRect(mx(b.x)-2,mz(b.z)-2,5,5)}for(let z of zombies){c2.fillStyle='#e67366';c2.beginPath();c2.arc(mx(z.x),mz(z.z),3,0,Math.PI*2);c2.fill()}c2.fillStyle='#ffffff';c2.beginPath();c2.arc(w/2,w/2,4,0,Math.PI*2);c2.fill();c2.strokeStyle='#fff';c2.lineWidth=2;c2.beginPath();c2.moveTo(w/2,w/2);c2.lineTo(w/2+Math.sin(state.yaw)*12,w/2-Math.cos(state.yaw)*12);c2.stroke()}
function update(dt){if(mode!=='play')return;state.elapsed+=dt;attackCd-=dt;spawnCd+=dt;saveCd+=dt;uiCd+=dt;state.food=clamp(state.food-dt*.052,0,100);state.water=clamp(state.water-dt*.074,0,100);if(state.food===0||state.water===0)state.hp-=dt*.7;let vx=move.x,vf=-move.y;if(keys.KeyA||keys.ArrowLeft)vx-=1;if(keys.KeyD||keys.ArrowRight)vx+=1;if(keys.KeyW||keys.ArrowUp)vf+=1;if(keys.KeyS||keys.ArrowDown)vf-=1;let mag=Math.hypot(vx,vf);if(mag>.1){vx/=Math.max(1,mag);vf/=Math.max(1,mag);let mx=Math.cos(state.camYaw)*vx+Math.sin(state.camYaw)*vf,mz=Math.sin(state.camYaw)*vx-Math.cos(state.camYaw)*vf;let running=(runToggle||keys.ShiftLeft)&&state.stamina>3,sp=running?5.2:3.1;let nx=state.x+mx*sp*dt,nz=state.z+mz*sp*dt;state.yaw=Math.atan2(mx,-mz);if(!collides(nx,state.z))state.x=nx;if(!collides(state.x,nz))state.z=nz;state.stamina=clamp(state.stamina-dt*(running?14:1),0,100)}else state.stamina=clamp(state.stamina+dt*13,0,100);for(let b of state.built)if(b.type==='fire'&&dist(b,state)<3)state.hp=clamp(state.hp+dt*.45,0,100);zombieUpdate(dt);if(spawnCd>12){spawnCd=0;spawnZombie()}if(saveCd>13){saveCd=0;persist()}if(uiCd>.25){uiCd=0;updateUI()}if(state.hp<=0){state.death++;state.hp=75;state.food=Math.max(40,state.food);state.water=Math.max(40,state.water);state.x=3;state.z=6;state.inv.food=0;notice('Du wurdest überwältigt. Respawn im Startgebiet.');zombies=[];persist()}}
function costText(c){return Object.entries(c).map(([k,v])=>`${v}× ${TYPES[k][1]}`).join(' · ')}function itemCards(){return Object.entries(TYPES).map(([k,v])=>`<div class="item"><div class="symbol">${v[0]}</div>${v[1]}<b>${state.inv[k]||0}</b></div>`).join('')}
function panel(type,arg){mode=type==='menu'?'menu':'panel';$('overlay').classList.remove('off');$('controls').classList.add('off');$('hud').classList.add('off');let main='';if(type==='menu'){let canLoad=!!localStorage.getItem(SAVE);main=`<div class="eyebrow">DEIN KOSTENLOSES 3D-SURVIVAL-SPIEL</div><div class="logo">LAST <em>SIGNAL</em><br><span style="font-size:.46em;letter-spacing:4px">SEKTOR 07 · 3D</span></div><p class="lede">Eine verlassene Region, verstreute Vorräte und Infizierte. Errichte eine sichere Hütte, lagere Vorräte und überlebe. Echtes WebGL-3D – direkt in Safari, ohne Installation oder Gebühren.</p><div class="chips"><span class="chip">☣ Zombies</span><span class="chip">⌂ Modulares Bauen</span><span class="chip">⚒ Crafting</span><span class="chip">✋ Sammeln</span><span class="chip">▣ Speichern</span></div><p class="tiny">Steuerung: linker virtueller Joystick bewegt, auf der rechten Bildschirmseite wischen dreht die Kamera. Zum Start empfehlen wir Querformat.</p><div class="buttons"><button class="btn" data-action="${canLoad?'continue':'new'}">${canLoad?'▶ WEITERSPIELEN':'▶ SPIEL STARTEN'}</button>${canLoad?'<button class="btn secondary" data-action="new">NEUES SPIEL</button>':''}</div>`}else if(type==='pause'){main=`<div class="eyebrow">SPIEL PAUSIERT</div><div class="heading">SEKTOR 07</div><p class="lede">Du kannst jederzeit weitermachen. Das Spiel speichert automatisch und beim Verlassen.</p><div class="buttons"><button class="btn" data-action="resume">WEITERSPIELEN</button><button class="btn secondary" data-action="save">SPIELSTAND SPEICHERN</button><button class="btn secondary" data-action="menu">HAUPTMENÜ</button></div><div class="divider"></div><div class="tiny">iPhone: Über Safari → Teilen → Zum Home-Bildschirm kann das Spiel wie eine Web-App gestartet werden.</div>`}else if(type==='craft'){main=`<div class="eyebrow">HANDWERK</div><div class="heading">CRAFTING</div><p class="subtitle">Materialien werden erst verbraucht, wenn du das Rezept auswählst.</p><div class="recipes">${Object.entries(recipes).map(([k,r])=>`<button class="recipe ${has(r.cost)?'can':''}" data-action="craft:${k}" ${has(r.cost)?'':'disabled'}><span class="sym">${r.icon}</span><span><strong>${r.name}</strong><small>${costText(r.cost)}</small><i>${has(r.cost)?'✓ Herstellen':'Material fehlt'}</i></span></button>`).join('')}</div><div class="buttons"><button class="btn secondary" data-action="resume">ZURÜCK</button></div>`}else if(type==='build'){main=`<div class="eyebrow">BAUEN · MODULARES SYSTEM</div><div class="heading">BASIS ERRICHTEN</div><p class="subtitle">Baue zuerst ein Fundament. Wände und Dach müssen an einem Fundament platziert werden. Im Baumodus grün = möglich, rot = gesperrt.</p><div class="recipes">${Object.entries(blueprints).map(([k,r])=>`<button class="recipe ${has(r.cost)?'can':''}" data-action="select:${k}" ${has(r.cost)?'':'disabled'}><span class="sym">${r.icon}</span><span><strong>${r.name}</strong><small>${costText(r.cost)}</small><i>${has(r.cost)?'✓ Bauvorschau':'Material fehlt'}</i></span></button>`).join('')}</div><div class="buttons"><button class="btn secondary" data-action="resume">ZURÜCK</button></div>`}else if(type==='bag'){main=`<div class="eyebrow">AUSRÜSTUNG</div><div class="heading">INVENTAR</div><div class="items">${itemCards()}</div><div class="buttons"><button class="btn" data-action="consume:food" ${state.inv.food?'':'disabled'}>🥫 ESSEN</button><button class="btn" data-action="consume:water" ${state.inv.water?'':'disabled'}>💧 TRINKEN</button><button class="btn" data-action="consume:bandage" ${state.inv.bandage?'':'disabled'}>✚ HEILEN</button><button class="btn secondary" data-action="resume">ZURÜCK</button></div><p class="tiny">Gegenstände werden beim Crafting und Bauen automatisch aus dem Inventar entnommen.</p>`}else if(type==='chest'){let b=state.built[arg],contents=state.chests[b.id]||{},qty=Object.values(contents).reduce((n,v)=>n+v,0),capacity=40;main=`<div class="eyebrow">PERSISTENTES LAGER</div><div class="heading">📦 LAGERKISTE</div><p class="subtitle">Belegung ${qty}/${capacity} Gegenstände. Entnahme und Einlagerung werden in einem Schritt gespeichert.</p><div class="progress"><div style="width:${qty/capacity*100}%"></div></div><div class="divider"></div><div class="items">${Object.entries(TYPES).map(([k,v])=>`<div class="item"><div class="symbol">${v[0]}</div>${v[1]}<b>${state.inv[k]||0} / ${contents[k]||0}</b><button ${(!state.inv[k]||qty>=capacity)?'disabled':''} data-action="store:${arg}:${k}">+ EINLAGERN</button><button ${!contents[k]?'disabled':''} data-action="take:${arg}:${k}">− ENTNEHMEN</button></div>`).join('')}</div><p class="tiny">Anzeigen: im Rucksack / in der Kiste</p><div class="buttons"><button class="btn secondary" data-action="resume">SCHLIESSEN</button></div>`}else if(type==='won'){main=`<div class="eyebrow">MISSION ERFÜLLT</div><div class="logo">SEKTOR <em>GESICHERT</em></div><p class="lede">Deine erste Basis ist errichtet: Fundament, Wände, Tür und Dach. Du hast Material eingelagert und Zombies abgewehrt. Du kannst die Welt jetzt weiter erkunden und zusätzliche Außenposten bauen.</p><div class="chips"><span class="chip">☣ ${state.kills} Zombies</span><span class="chip">⌂ ${state.built.length} Bauteile</span><span class="chip">▣ Spielstand gespeichert</span></div><div class="buttons"><button class="btn" data-action="resume">WEITER ÜBERLEBEN</button></div>`}else{main='<div class="heading">LAST SIGNAL</div>'} $('panel').innerHTML=main;persist()}
function resume(){mode='play';$('overlay').classList.add('off');$('controls').classList.remove('off');$('hud').classList.remove('off');updateUI()}
function notice(t){let n=$('toast');n.textContent=t;n.classList.add('show');clearTimeout(toaster);toaster=setTimeout(()=>n.classList.remove('show'),2300)}
function persist(){if(!state)return;try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){console.warn('Speichern nicht möglich',e)}}
function load(){try{let s=JSON.parse(localStorage.getItem(SAVE));if(!s||!Array.isArray(s.built)||!s.inv||!Array.isArray(s.taken))return false;state={...newState(),...s,inv:{...newState().inv,...s.inv}};staticDirty=true;return true}catch(e){return false}}
function restart(){state=newState();zombies=[];staticDirty=true;runToggle=false;buildType=null;buildRot=0;localStorage.removeItem(SAVE);for(let i=0;i<3;i++)spawnZombie();resume();persist()}
function makeSound(freq,end,volume=.07){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctxAudio)ctxAudio=new AC();if(ctxAudio.state==='suspended')ctxAudio.resume();let o=ctxAudio.createOscillator(),g=ctxAudio.createGain(),t=ctxAudio.currentTime;o.type='triangle';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(end,t+.16);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(g);g.connect(ctxAudio.destination);o.start(t);o.stop(t+.18)}catch(e){}}
function sound(type){let spec={loot:[390,630],craft:[330,680],hit:[220,90],swing:[160,105],hurt:[100,55]}[type];if(spec)makeSound(...spec)}
function consume(k){if(!state.inv[k])return;if(k==='food')state.food=clamp(state.food+32,0,100);if(k==='water')state.water=clamp(state.water+39,0,100);if(k==='bandage')state.hp=clamp(state.hp+45,0,100);state.inv[k]--;sound('loot');persist();panel('bag')}
function craft(k){let r=recipes[k];if(!r||!has(r.cost)){notice('Material fehlt');return}if(r.special==='essen'){consume('food');panel('craft');return}if(r.special==='trinken'){consume('water');panel('craft');return}spend(r.cost);for(let[item,n]of Object.entries(r.give))addItem(item,n);sound('craft');notice(r.name+' hergestellt');persist();panel('craft')}
function inventoryTransfer(action,index,k){const b=state.built[index];if(!b||b.type!=='crate'||dist(b,state)>4){notice('Kiste außer Reichweite');return}let chest=state.chests[b.id]||{},qty=Object.values(chest).reduce((a,v)=>a+v,0);if(action==='store'&&state.inv[k]>0&&qty<40){state.inv[k]--;chest[k]=(chest[k]||0)+1}else if(action==='take'&&(chest[k]||0)>0){chest[k]--;state.inv[k]=(state.inv[k]||0)+1}else{notice('Kiste voll oder Gegenstand fehlt');return}state.chests[b.id]=chest;persist();panel('chest',index);checkWin()}
$('panel').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let [action,a,c]=b.dataset.action.split(':');if(action==='new'){restart();return}if(action==='continue'){if(!load()){restart();return}zombies=[];for(let i=0;i<3;i++)spawnZombie();resume();return}if(action==='resume'){resume();return}if(action==='save'){persist();notice('Gespeichert');resume();return}if(action==='menu'){panel('menu');return}if(action==='craft'){craft(a);return}if(action==='consume'){consume(a);return}if(action==='select'){buildType=a;buildRot=0;resume();$('buildTools').classList.add('visible');notice(blueprints[a].name+': vor dir platzieren');return}if(action==='store'||action==='take'){inventoryTransfer(action,Number(a),c);return}});
$('menuBtn').onclick=()=>panel('pause');$('bagBtn').onclick=()=>panel('bag');$('craftBtn').onclick=()=>panel('craft');$('buildBtn').onclick=()=>panel('build');$('gatherBtn').onclick=harvest;$('attackBtn').onclick=hit;$('placeBtn').onclick=placeBuild;$('rotateBtn').onclick=()=>{buildRot=(buildRot+Math.PI/2)%(Math.PI*2);notice('Bauteil gedreht')};$('cancelBtn').onclick=()=>{buildType=null;$('buildTools').classList.remove('visible');notice('Bauen abgebrochen')};$('runBtn').onclick=()=>{runToggle=!runToggle;$('runBtn').style.borderColor=runToggle?'#fba96b':'#c4d1ae80';notice(runToggle?'Rennen an':'Rennen aus')};
const zone=$('stickZone'),stick=$('stick'),nub=$('nub');let stickPointer=null;function stickMove(e){let rect=stick.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),r=rect.width*.35,scale=Math.min(1,r/Math.max(1,len));move.x=dx*scale/r;move.y=dy*scale/r;nub.style.transform=`translate(${dx*scale}px,${dy*scale}px)`}zone.addEventListener('pointerdown',e=>{if(stickPointer!==null)return;stickPointer=e.pointerId;zone.setPointerCapture(e.pointerId);stickMove(e);e.preventDefault()});zone.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)stickMove(e)});function releaseStick(e){if(e.pointerId!==stickPointer)return;stickPointer=null;move.x=0;move.y=0;nub.style.transform='translate(0,0)'}zone.addEventListener('pointerup',releaseStick);zone.addEventListener('pointercancel',releaseStick);
$('scene').addEventListener('pointerdown',e=>{if(mode!=='play'||e.clientX<window.innerWidth*.38)return;touchCam={id:e.pointerId,x:e.clientX};$('scene').setPointerCapture(e.pointerId)});$('scene').addEventListener('pointermove',e=>{if(!touchCam||touchCam.id!==e.pointerId)return;let dx=e.clientX-touchCam.x;state.camYaw+=dx*.008;touchCam.x=e.clientX});['pointerup','pointercancel'].forEach(k=>$('scene').addEventListener(k,e=>{if(touchCam&&touchCam.id===e.pointerId)touchCam=null}));
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space')hit();if(e.code==='KeyE')harvest();if(e.code==='KeyI')panel('bag');if(e.code==='KeyC')panel('craft');if(e.code==='KeyB')panel('build');if(e.code==='Escape'&&mode==='play')panel('pause');else if(e.code==='Escape'&&mode==='panel')resume()});window.addEventListener('keyup',e=>{keys[e.code]=false});window.addEventListener('blur',()=>{move.x=move.y=0;if(state)persist()});document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();move.x=move.y=0}});window.addEventListener('pagehide',persist);$('scene').addEventListener('webglcontextlost',e=>{e.preventDefault();persist();$('error').style.display='block';$('error').textContent='Grafik-Kontext verloren. Bitte die Seite neu laden; dein Fortschritt wurde gespeichert.'});
// deterministic smoke checks can be run from desktop browser console or via ?smoke=1
window.LastSignalTest={start:restart,load,save:persist,getState:()=>structuredClone(state),give:(k,n)=>{addItem(k,n);persist()},craft,build:(type,x,z,rot=0)=>{if(!blueprints[type])return false;let b={type,x,z,rot,id:state.built.length?Math.max(...state.built.map(v=>v.id||0))+1:1,hp:100};state.built.push(b);if(type==='crate')state.chests[b.id]={};staticDirty=true;persist();return true},getWebGL:()=>!!gl,checkWin};
let last=performance.now();function loop(ts){let dt=clamp((ts-last)/1000,0,.055);last=ts;try{update(dt);if(state)render()}catch(e){console.error('Last Signal Laufzeitfehler:',e);$('error').style.display='block';$('error').textContent='Ein Grafikfehler ist aufgetreten: '+e.message+' · Lade die Seite neu, dein Spielstand ist gespeichert.';return}requestAnimationFrame(loop)}
if(new URLSearchParams(location.search).has('smoke')){restart();window.__smoke='ok';document.documentElement.dataset.smoke='ok'}else{state=newState();panel('menu')}
requestAnimationFrame(loop);
})();
